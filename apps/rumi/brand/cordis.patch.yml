# Rumi's own brand occupants. The stock official brand package is disabled in
# the profile patch so these single slots stay free.
- insert:
    - id: rumi-brand
      name: '@rumi/brand'
      config: {}

# Replace preset declarations while retaining their identities for resumed chats.
- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- insert:
    - id: rumi-presets
      name: '@rumi/brand/preset'
- id: ui-user-questions
  disabled: true
